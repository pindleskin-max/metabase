# Metabase 双域名反代：bi.chs6.cn + bi.cry6.cn → 127.0.0.1:3000
# 部署：sudo cp deploy/nginx-metabase-chs6-cry6.conf /etc/nginx/conf.d/metabase-bi-domains.conf
# 仅第一个 443 块使用 listen [::]:443 ssl ipv6only=on，避免 duplicate listen 错误。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- bi.chs6.cn (HTTPS) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name bi.chs6.cn;

    ssl_certificate     /etc/letsencrypt/live/bi.chs6.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bi.chs6.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# --- bi.cry6.cn (HTTPS) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bi.cry6.cn;

    ssl_certificate     /etc/letsencrypt/live/bi.cry6.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bi.cry6.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# --- HTTP → HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name bi.chs6.cn bi.cry6.cn;
    return 301 https://$host$request_uri;
}
