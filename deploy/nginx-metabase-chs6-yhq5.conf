# Metabase 双域名反代：bi.chs6.cn + bi.yhq5.cn → 127.0.0.1:3000
# 部署：sudo cp deploy/nginx-metabase-chs6-yhq5.conf /etc/nginx/sites-available/metabase
#       sudo ln -sf /etc/nginx/sites-available/metabase /etc/nginx/sites-enabled/metabase
# 仅第一个 443 块使用 listen [::]:443 ssl ipv6only=on，避免 duplicate listen 错误。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- bi.chs6.cn (HTTPS) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name bi.chs6.cn;

    ssl_certificate     /etc/letsencrypt/live/bi.chs6.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bi.chs6.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# --- bi.yhq5.cn (HTTPS) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bi.yhq5.cn;

    ssl_certificate     /etc/letsencrypt/live/bi.yhq5.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bi.yhq5.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# --- HTTP → HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name bi.chs6.cn bi.yhq5.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
